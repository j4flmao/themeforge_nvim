name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create archive
        shell: bash
        run: |
          mkdir -p dist/themeforge.nvim
          rsync -a --exclude='.git' --exclude='dist' ./ dist/themeforge.nvim/
          tar -czf "dist/themeforge.nvim-${GITHUB_REF_NAME}.tar.gz" -C dist themeforge.nvim

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/themeforge.nvim-${{ github.ref_name }}.tar.gz
